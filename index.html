<!DOCTYPE html>

<html lang="th">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>เที่ยวทั่วไทย Challenge</title>

<style>

body{font-family:sans-serif;background:#fff4df;text-align:center;padding:18px;color:#49351f}

main{max-width:520px;margin:auto;background:white;padding:22px;border-radius:20px;box-shadow:0 4px 15px #0002}

h1{color:#c66b23}

button{border:0;border-radius:12px;padding:14px;margin:7px;font-size:17px;background:#f4a340;color:#fff;width:90%;cursor:pointer}

button:active{opacity:.7}

#question{font-size:22px;font-weight:bold;margin:25px 0}

#status{font-size:18px;margin:15px}

#message{min-height:35px;font-weight:bold}

</style>

</head>

<body>

<main>

<h1>🇹🇭 เที่ยวทั่วไทย Challenge</h1>

<p>ตอบคำถามสถานที่ท่องเที่ยวทั่วไทย</p>

<div id="status">❤️❤️❤️❤️❤️ | คะแนน 0</div>

<div id="question">พร้อมออกเดินทางหรือยัง?</div>

<div id="answers"></div>

<div id="message"></div>

<button id="start">เริ่มเกม</button>

</main>

<script>

const places = [

["วัดพระแก้ว","กรุงเทพมหานคร"],

["พระบรมมหาราชวัง","กรุงเทพมหานคร"],

["วัดอรุณราชวราราม","กรุงเทพมหานคร"],

["ตลาดน้ำดำเนินสะดวก","ราชบุรี"],

["สะพานข้ามแม่น้ำแคว","กาญจนบุรี"],

["น้ำตกเอราวัณ","กาญจนบุรี"],

["อุทยานประวัติศาสตร์อยุธยา","พระนครศรีอยุธยา"],

["วัดมหาธาตุ","พระนครศรีอยุธยา"],

["พระปฐมเจดีย์","นครปฐม"],

["ตลาดร่มหุบ","สมุทรสงคราม"],

["หาดหัวหิน","ประจวบคีรีขันธ์"],

["อ่าวมะนาว","ประจวบคีรีขันธ์"],

["เขาสามร้อยยอด","ประจวบคีรีขันธ์"],

["เกาะล้าน","ชลบุรี"],

["ปราสาทสัจธรรม","ชลบุรี"],

["เกาะเสม็ด","ระยอง"],

["เกาะช้าง","ตราด"],

["อุทยานแห่งชาติเขาใหญ่","นครราชสีมา"],
document.getElementById("start").onclick = function() {

  document.getElementById("question").textContent = "เริ่มเกมแล้ว! 🇹🇭";

  document.getElementById("message").textContent = "พร้อมออกเดินทางแล้ว";
</script>

</body>

</html>

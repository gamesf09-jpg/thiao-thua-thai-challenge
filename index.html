<!DOCTYPE html>

<html lang="th">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>เที่ยวทั่วไทย Challenge</title>

<style>

*{box-sizing:border-box}

body{margin:0;padding:20px;font-family:Arial,sans-serif;background:linear-gradient(135deg,#dff7ff,#fff1d6);color:#243447;text-align:center}

main{max-width:650px;margin:auto;background:white;padding:22px;border-radius:22px;box-shadow:0 5px 22px #0002}

h1{color:#087e8b}

.stats{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin:15px 0;font-weight:bold}

#photo{width:100%;height:280px;object-fit:cover;border-radius:15px;background:#e8eef0}

button{border:0;border-radius:12px;padding:14px;margin:6px;font-size:17px;cursor:pointer}

.primary{background:#078b91;color:white;width:90%;font-weight:bold}

.choice{background:#edf5f6;color:#234;width:100%}

.choice:disabled{opacity:.8}

#message{font-weight:bold;min-height:28px;margin:12px}

.small{font-size:13px;color:#667}

</style>

</head>

<body>

<main>

<h1>🇹🇭 เที่ยวทั่วไทย Challenge</h1>

<p>ทายสถานที่ท่องเที่ยวไทยให้ครบ 54 ด่าน!</p>

<div class="stats">

<span id="stage">ด่าน 1 / 54</span>

<span id="hearts">❤️❤️❤️❤️❤️</span>

<span id="score">คะแนน 0</span>

</div>

<img id="photo" alt="ภาพสถานที่ท่องเที่ยว">

<p id="photoNote" class="small">ภาพสถานที่ท่องเที่ยว</p>

<h3 id="question">กดเริ่มเกมเพื่อเล่น</h3>

<div id="choices"></div>

<div id="message"></div>

<button class="primary" id="start">เริ่มเกม</button>

<button class="primary" id="next" hidden>ข้อต่อไป</button>

<p class="small">เกมจะบันทึกความคืบหน้าไว้ในอุปกรณ์นี้</p>

</main>

<script>

const places = [

["วัดพระแก้ว","กรุงเทพมหานคร"],

["พระปฐมเจดีย์","นครปฐม"],

["สะพานข้ามแม่น้ำแคว","กาญจนบุรี"],const $ = id => document.getElementById(id);

let stage = Number(localStorage.getItem("thaiStage") || 0);

let score = Number(localStorage.getItem("thaiScore") || 0);

let hearts = 5;

let lockedUntil = Number(localStorage.getItem("thaiLock") || 0);

let current = null;

let answered = false;

function saveProgress() {

  localStorage.setItem("thaiStage", stage);

  localStorage.setItem("thaiScore", score);

}

function updateStats() {

  $("stage").textContent = `ด่าน ${Math.min(stage + 1, 54)} / 54`;

  $("hearts").textContent = "❤️".repeat(hearts) + "🖤".repeat(5 - hearts);

  $("score").textContent = "คะแนน " + score;

}

function shuffle(list) {

  return [...list].sort(() => Math.random() - 0.5);

}

async function loadPhoto(place) {

  const img = $("photo");

  img.src = "";

  $("photoNote").textContent = "กำลังค้นหารูปภาพ...";

  try {

    const query = encodeURIComponent(place[0] + " " + place[1] + " Thailand");

    const url = "https://commons.wikimedia.org/w/api.php?action=query&generator=search&gsrsearch=" +

      query + "&gsrnamespace=6&gsrlimit=10&prop=imageinfo&iiprop=url&iiurlwidth=900&format=json&origin=*";

    const response = await fetch(url);

    const data = await response.json();

    const pages = Object.values(data.query?.pages || {});

    const found = pages.find(p => p.imageinfo?.[0]?.thumburl);

    if (found) {

      img.src = found.imageinfo[0].thumburl;

      $("photoNote").textContent = "ภาพจาก Wikimedia Commons";

    } else {

      $("photoNote").textContent = "ยังไม่พบภาพของสถานที่นี้";</script>

</body>

</html>
